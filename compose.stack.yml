services:
  api:
    image: myapi:stack          # используем собранный образ
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://myuser:mypass@db:5432/mydb"
    depends_on:
      - db                       # простой список, без condition
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
    networks:
      - backend    

  db:
    image: postgres:16-alpine
    secrets:
      - db_password
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
    networks:
        - backend
      
      
networks:
  backend:

volumes:
  pgdata:

secrets:
  db_password:
    external: true
